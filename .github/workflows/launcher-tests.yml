name: TT-Studio Launcher Tests

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - "main"
      - "staging"
      - "dev"
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "tt_setup/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/launcher-tests.yml"

jobs:
  launcher-tests:
    name: run.py / tt_setup tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # 3.11 is the floor declared in pyproject.toml (requires-python).
          python-version: "3.11"
          cache: "pip"

      - name: Install the launcher package and test runner
        run: |
          python -m pip install --upgrade pip
          pip install . pytest==9.0.3 coverage==7.15.1

      - name: Run the tt_setup test suite with coverage
        run: |
          coverage run --source=tt_setup -m pytest tests/ -q
          coverage report -m --fail-under=25
