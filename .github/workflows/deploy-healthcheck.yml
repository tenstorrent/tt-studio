# Deploy healthcheck CI — drives ci/deploy_healthcheck.py against a live TT-Studio
# backend on a Tenstorrent self-hosted runner.
#
# Access / security model (public repo):
#   * NO `pull_request` trigger — forks can never reach the hardware.
#   * `workflow_dispatch` only — restricted to users with write access (internal
#     devs). They pick which branch to run from the "Run workflow" dropdown, so
#     a feature branch can be tested manually without merging it anywhere.

name: Deploy Healthcheck

on:
  # Manual only. Restricted to users with write access; they pick the branch to run from the "Run workflow" dropdown.
  workflow_dispatch:
    inputs:
      models:
        description: "Model(s) to deploy, space-separated (matched against the catalog). Ignored if 'all_compatible' is checked."
        type: string
        default: "Llama-3.1-8B-Instruct"
      all_compatible:
        description: "Deploy EVERY model the frontend shows as compatible with the runner's board (long — timeout is per model)."
        type: boolean
        default: false
      timeout:
        description: "Total wall-clock budget per model (deploy + resolve + health), e.g. 4h, 90m, 3600s."
        type: string
        default: "2h"
      runner_label:
        description: "Self-hosted runner label to target."
        type: choice
        default: "pool"
        options:
          - pool
          - qbge-devex-01
          - qbge-devex-02

# Serialize per runner label so two runs never fight over the same board.
concurrency:
  group: deploy-healthcheck-${{ github.event.inputs.runner_label || 'pool' }}
  cancel-in-progress: false

# Least privilege: this job needs no write access to the repo.
permissions:
  contents: read

jobs:
  healthcheck:
    # Targets [self-hosted, <label>]; the runner MUST carry the chosen label (default "pool") or the job queues forever.
    runs-on:
      - self-hosted
      - ${{ github.event.inputs.runner_label || 'pool' }}
    # Deploys can run hours; caps a hung run (does not cap a queued job).
    timeout-minutes: 360

    steps:
      - name: Guard — inference host service not held by another user
        # Ensure no other user is running TT-Studio on this runner.
        run: |
          set -uo pipefail
          for port in 8001; do
            if ss -ltn "sport = :$port" 2>/dev/null | grep -q LISTEN; then
              if ss -ltnp "sport = :$port" 2>/dev/null | grep -q 'users:'; then
                echo ":$port in use by a process this runner owns (prior run) — --stop will clear it."
              else
                echo "::error::Port :$port is held by a process owned by ANOTHER user. TT-Studio's inference-api (:8001) is a single-instance host service, and this runner cannot stop another user's stack. Ask them to run 'python run.py --stop' on the box, then re-run this workflow."
                exit 1
              fi
            fi
          done
          echo "host inference service :8001 is clear (or owned by this runner)"

      - name: Reclaim workspace (drop root-owned leftovers from a prior run)
        # Remove root-owned leftovers from a prior run.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" alpine \
            sh -c 'rm -rf /w/tt_studio_persistent_volume /w/.artifacts /w/logs' 2>/dev/null || true

      - name: Checkout the dispatched branch
        uses: actions/checkout@v4

      - name: Show what is under test
        run: echo "ref=${{ github.ref_name }}  models='${{ github.event.inputs.models }}'  runner=${{ github.event.inputs.runner_label }}"

      - name: Stop any prior TT-Studio stack
        run: python3 run.py --stop || true

      - name: Boot TT-Studio
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python3 run.py --accept-terms

      - name: Wait for backend health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/up/ >/dev/null 2>&1 && { echo "backend up"; exit 0; }
            echo "waiting for backend... ($i)"; sleep 5
          done
          echo "::error::backend did not come up on :8000"; exit 1

      - name: Run deploy healthcheck
        env:
          MODELS: ${{ github.event.inputs.models || 'Llama-3.1-8B-Instruct' }}
          TIMEOUT: ${{ github.event.inputs.timeout || '2h' }}
          ALL_COMPATIBLE: ${{ github.event.inputs.all_compatible }}
        run: |
          set -euo pipefail
          # deploy_healthcheck.py resets the board, mirrors the UI deploy, cleans
          # up by default, and writes the step summary + ::error:: annotations.
          # Its exit code drives the pass/fail ✓.
          if [ "${ALL_COMPATIBLE:-false}" = "true" ]; then
            # Deploy every model the frontend marks compatible with this board.
            python3 ci/deploy_healthcheck.py --all-compatible --timeout "$TIMEOUT"
          else
            IFS=' ' read -r -a models_arr <<<"$MODELS"
            python3 ci/deploy_healthcheck.py --models "${models_arr[@]}" --timeout "$TIMEOUT"
          fi

      - name: Collect extra logs into the artifact
        if: always()
        # Runs before cleanup so nothing is wiped first. The checkout is fresh
        # each run (git clean -ffdx), so these dirs hold ONLY this session's logs.
        # ./logs (host services + per-deploy) and the inference-server's workflow_logs collected.
        run: |
          set -uo pipefail
          dest="ci-runs/collected-logs"
          mkdir -p "$dest"
          if [ -d logs ]; then
            cp -r logs "$dest/logs"
            find "$dest/logs" -name '*.pid' -delete   # drop pid files, keep logs
          fi
          ws=".artifacts/tt-inference-server/workflow_logs"
          [ -d "$ws" ] && cp -r "$ws" "$dest/workflow_logs" || true
          echo "collected $(find "$dest" -type f | wc -l) log files into $dest"

      - name: Upload logs + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-runs-${{ github.run_id }}
          path: ci-runs/
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup (free the board)
        if: always()
        # Backstop teardown so a cancelled/failed run never wedges the next one.
        run: python3 run.py --stop || true
