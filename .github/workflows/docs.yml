# Build the TT-Studio documentation site (Sphinx) and publish it to GitHub
# Pages. The published site is served at https://docs.tenstorrent.com/tt-studio/.
#
# NOTE: this requires the repository Pages source to be set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source: GitHub Actions).
name: docs

on:
  push:
    branches: [dev, main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check for leaked generator artifacts
        # The pages were originally exported from a tool that appended chunks of
        # its own response stream to the end of each file. Catch a re-export
        # that reintroduces them before it reaches the published site.
        run: |
          if grep -rnE '[0-9a-f]{2}:T[0-9a-f]{4},' docs --include='*.md'; then
            echo "::error::Leaked generator stream markers found in docs/"
            exit 1
          fi
      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt
      - name: Build HTML
        # dirhtml gives clean, extensionless page URLs (foo/ instead of foo.html)
        run: sphinx-build -b dirhtml docs docs/_build/html --keep-going -n
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # Only deploy from the default publishing branches, not from PRs.
  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
