name: Desktop CI

# Build checks for the Tauri desktop shell under desktop/: launcher bundle
# (npm), Rust lint/format/tests, and a debug tauri build (no bundling) on all
# three desktop OSes.
#
# Note: if any of these jobs become required status checks, the paths filter
# below will leave non-desktop PRs waiting on "expected" checks — switch to
# an in-workflow change detector (e.g. dorny/paths-filter) at that point.

on:
  pull_request:
    branches: [dev, main, staging]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  push:
    branches: [dev]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install launcher dependencies
        working-directory: desktop
        run: npm ci

      # The Rust build embeds ../dist via tauri::generate_context!, so the
      # launcher bundle must exist before any cargo compile step.
      - name: Build launcher bundle
        working-directory: desktop
        run: npm run build

      - name: Launcher unit tests
        working-directory: desktop
        run: npm test

      - name: Check Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      # SSH tunnel integration tests run against a containerized sshd
      # (tests/fixtures/sshd) — only the Linux runner has Linux containers.
      - name: SSH tunnel integration tests
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        run: cargo test --test ssh_tunnel -- --ignored

      # Debug + no-bundle keeps this fast and reuses the clippy/test build
      # cache while still exercising the full tauri build path.
      - name: Tauri build (debug, no bundle)
        working-directory: desktop
        run: npm run tauri build -- --debug --no-bundle
