services:
  tt_studio_docker_control:
    hostname: tt-studio-docker-control
    container_name: tt_studio_docker_control
    profiles:
      - docker-control
    build:
      context: ../docker-control-service
      dockerfile: Dockerfile
    command: ["python", "entrypoint.py", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      - DOCKER_CONTROL_HOST=0.0.0.0
      - DOCKER_CONTROL_PORT=8002
      - DOCKER_CONTROL_JWT_SECRET
      - DOCKER_CONTROL_LOG_FILE=/logs/docker-control-service.log
      - STARTUP_LOG_FILE=/logs/startup.log
      - MODEL_RUN_LOG_FILE=/logs/model_run.log
    volumes:
      # Only Docker Control receives the Docker socket. The backend remains
      # unprivileged and communicates with this service over the bridge.
      # Source is configurable for rootless/custom Docker installations; keep
      # the conventional target so the Docker SDK in this container works.
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ${TT_STUDIO_ROOT}/logs:/logs
    networks:
      tt_studio_network:
        aliases:
          - docker-control
    restart: unless-stopped
    healthcheck:
      # The endpoint reports Docker daemon failures in its JSON body while
      # keeping the HTTP response inspectable. Gate startup on that check,
      # rather than treating any HTTP 200 as a usable Docker Control service.
      test: ["CMD", "python", "-c", "import json, sys, urllib.request; payload = json.load(urllib.request.urlopen('http://127.0.0.1:8002/api/v1/health', timeout=3)); sys.exit(0 if payload.get('checks', {}).get('docker') == 'healthy' else 1)"]
      timeout: 5s
      interval: 5s
      retries: 10
      start_period: 10s

  tt_studio_backend:
    #! hostnames must not contain underscores
    hostname: tt-studio-backend-api
    image: ghcr.io/tenstorrent/tt-studio/backend:v0.0.1
    build: 
      context: ./backend
      args:
        - VITE_ENABLE_DEPLOYED=${VITE_ENABLE_DEPLOYED}
    #* DEV: Uncomment devices to use Tenstorrent hardware
    # devices:
    #* mounts all tenstorrent devices to backend container
    # - /dev/tenstorrent:/dev/tenstorrent
    # note that `network_mode: host` does not work on mac OS
    networks:
      - tt_studio_network
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput && uvicorn api.asgi:application --host 0.0.0.0 --port 8000 --workers 4 --timeout-keep-alive 1200"
    depends_on:
      tt_studio_chroma:
        condition: service_healthy
      tt_studio_docker_control:
        condition: service_healthy
    stdin_open: true
    tty: true
    environment:
      # env vars come from the repo-root .env (run.py passes it via --env-file); .env.default is the template
      # ./backend is bind-mounted from the host repo; keep root-owned
      # __pycache__ out of the source tree
      - PYTHONDONTWRITEBYTECODE=1
      - CHROMA_DB_HOST=tt_studio_chroma
      - CHROMA_DB_PORT=8111
      - CHROMA_DB_EMBED_MODEL=${CHROMA_DB_EMBED_MODEL:-all-MiniLM-L6-v2}
      - RAG_RELEVANCE_THRESHOLD=${RAG_RELEVANCE_THRESHOLD:-}
      - RAG_QUERY_REWRITE=${RAG_QUERY_REWRITE:-false}
      - RAG_CONTEXT_TOKEN_BUDGET=${RAG_CONTEXT_TOKEN_BUDGET:-2000}
      - RAG_RERANK_ENABLED=${RAG_RERANK_ENABLED:-true}
      - RAG_RERANK_MIN_SCORE=${RAG_RERANK_MIN_SCORE:-0.05}
      - RAG_RERANK_FLOOR=${RAG_RERANK_FLOOR:-2}
      - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-750}
      - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-100}
      - TT_STUDIO_ROOT
      - HOST_PERSISTENT_STORAGE_VOLUME
      - INTERNAL_PERSISTENT_STORAGE_VOLUME
      - BACKEND_API_HOSTNAME
      - JWT_SECRET
      - HF_TOKEN
      - TTS_API_KEY
      - TAVILY_API_KEY
      - TT_INFERENCE_ARTIFACT_BRANCH
      - TT_INFERENCE_ARTIFACT_VERSION
      - CLOUD_CHAT_UI_URL
      - CLOUD_CHAT_UI_AUTH_TOKEN
      - CLOUD_YOLOV4_API_URL
      - CLOUD_YOLOV4_API_AUTH_TOKEN
      - RAG_ADMIN_PASSWORD
      - CLOUD_SPEECH_RECOGNITION_URL
      - CLOUD_SPEECH_RECOGNITION_AUTH_TOKEN
      - CLOUD_STABLE_DIFFUSION_URL
      - CLOUD_STABLE_DIFFUSION_AUTH_TOKEN
      - TEAM_ID
      - TOKEN_ID
      - GITHUB_USERNAME
      - GITHUB_PAT
      - VITE_ENABLE_DEPLOYED
      - WAKEWORD_MODEL
      - WAKEWORD_THRESHOLD
      - WAKEWORD_DEBUG_SCORES
      # Docker Control is always addressed by its private Compose alias. Keep
      # this explicit so a pre-migration .env cannot route the backend back to
      # the retired host port.
      - DOCKER_CONTROL_SERVICE_URL=http://docker-control:8002
      - DOCKER_CONTROL_JWT_SECRET
      - TT_INFERENCE_API_URL
      # LiteLLM coding-agent gateway
      - LITELLM_MASTER_KEY
      - LITELLM_UPSTREAM_KEY
      - LITELLM_PORT
    volumes:
      - ${HOST_PERSISTENT_STORAGE_VOLUME}:${INTERNAL_PERSISTENT_STORAGE_VOLUME}
      # Mount the local api directory for live code changes
      - ./backend:/backend
      # Mount tt-inference-server workflow logs for viewing deployment logs
      - ${TT_STUDIO_ROOT}/.artifacts/tt-inference-server/workflow_logs:${TT_STUDIO_ROOT}/.artifacts/tt-inference-server/workflow_logs:ro
      # Mount logs/model_run_logs/ directory so the backend can read per-deployment logs
      - ${TT_STUDIO_ROOT}/logs/model_run_logs:${TT_STUDIO_ROOT}/logs/model_run_logs:ro

    healthcheck:
      # On a cold Chroma volume the backend embeds its internal knowledge corpus
      # before serving. The UI should not start until that finishes.
      # Adjust timeout if on a very slow machine.
      test: ["CMD", "curl", "-f", "http://localhost:8000/up/"]
      timeout: 120s
      interval: 10s
      retries: 5
      # Embedding the corpus is CPU-bound and slow; allow time so the healthcheck
      # doesn't mark the backend unhealthy mid-ingest.
      start_period: 300s
    # Allow container to access the host inference API. Docker Control is an
    # internal Compose service and is reached through the bridge alias above.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tt_studio_frontend:
    hostname: tt-studio-frontend
    # Container name and image are defined in mode-specific override files
    # Build configuration is defined in mode-specific override files
    depends_on:
      tt_studio_backend:
        condition: service_healthy
    networks:
      - tt_studio_network
    # Ports and healthcheck are defined in mode-specific override files

  tt_studio_agent:
    hostname: tt-studio-agent
    user: "1000:1000"  # run non-root; no host mounts, so no ownership impact
    # Container name and image are defined in mode-specific override files
    build: ./agent
    depends_on:
      tt_studio_backend:
        condition: service_healthy
    networks:
      - tt_studio_network
    ports:
      - "8080:8080"
    environment:
      # dev mode bind-mounts ./agent; keep bytecode out of the source tree
      - PYTHONDONTWRITEBYTECODE=1
      - JWT_SECRET
      - TAVILY_API_KEY
      - CLOUD_CHAT_UI_URL
      - CLOUD_CHAT_UI_AUTH_TOKEN
      - USE_CLOUD_LLM=true
      - LLM_CONTAINER_NAME
      - BACKEND_API_HOSTNAME
      - AGENT_LLM_POLLING_TIMEOUT
      - AGENT_LLM_POLLING_MAX_ATTEMPTS
      - AGENT_LLM_POLLING_CIRCUIT_BREAKER_THRESHOLD
      # - E2B_API_KEY
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      timeout: 60s
      interval: 10s
      retries: 3
      start_period: 30s

  tt_studio_litellm:
    hostname: tt-studio-litellm
    # Pinned by digest for reproducibility; bump intentionally (current: main-stable)
    image: ghcr.io/berriai/litellm:main-stable@sha256:89ccaccfda9083f7693777597ca27f8ffca12045e4fa9277155fb7c5f06e68b2
    container_name: tt_studio_litellm
    user: "1000:1000"  # run non-root; only reads a read-only config mount
    networks:
      - tt_studio_network
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      - LITELLM_MASTER_KEY
      - LITELLM_UPSTREAM_KEY
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      tt_studio_backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status==200 else 1)\""]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  tt_studio_chroma:
    image: chromadb/chroma:0.5.3
    volumes:
      # Be aware that indexed data are located in "/chroma/chroma/"
      # Default configuration for persist_directory in chromadb/config.py
      # Read more about deployments: https://docs.trychroma.com/deployment
      - ${HOST_PERSISTENT_STORAGE_VOLUME}/chroma:/chroma/chroma
    command: "--workers 1 --host 0.0.0.0 --port 8111 --proxy-headers --log-config chromadb/log_config.yml --timeout-keep-alive 30"
    environment:
      - IS_PERSISTENT=TRUE
      # - CHROMA_AUTH_TOKEN_TRANSPORT_HEADER=${CHROMA_AUTH_TOKEN_TRANSPORT_HEADER}
      # - PERSIST_DIRECTORY=${INTERNAL_PERSISTENT_STORAGE_VOLUME}/chroma
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["http://localhost:3000", "http://tt_studio_frontend", "http://localhost:8000"]
    restart: unless-stopped # possible values are: "no", always", "on-failure", "unless-stopped"
    ports:
      - "8111:8111"
    healthcheck:
      # Adjust below to match your container port
      test: ["CMD", "curl", "-f", "http://localhost:8111/api/v1/heartbeat"]
      interval: 10s
      timeout: 10s
      retries: 3
    container_name: tt_studio_chroma

    networks:
      - tt_studio_network

networks:
  tt_studio_network:
    # need external flag to allow for the backend to manage the docker network
    # otherwise, docker compose will create an app_* network for the backend container
    # to avoid colliding existing docker networks
    external: true
    name: tt_studio_network
