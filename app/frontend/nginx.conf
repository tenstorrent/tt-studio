server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    # Proxy API calls to backend service
    location /models-api/ {
        proxy_pass         http://tt-studio-backend-api:8000/models/;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1200s;
        add_header         X-Accel-Buffering no;
    }

    location /board-api/ {
        proxy_pass http://tt-studio-backend-api:8000/board/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docker-api/ {
        proxy_pass         http://tt-studio-backend-api:8000/docker/;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1200s;       # Allow for long-running streams 
        add_header         X-Accel-Buffering no;
    }

    location /logs-api/ {
        proxy_pass http://tt-studio-backend-api:8000/logs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /collections-api/ {
        proxy_pass http://tt-studio-backend-api:8000/collections/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vector-db-api/ {
        proxy_pass http://tt-studio-backend-api:8000/collections/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /settings-api/ {
        proxy_pass http://tt-studio-backend-api:8000/settings/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy for the wakeword voice pipeline (mirrors the /ws-api ->
    # /ws rewrite in vite.config.ts; the backend serves it via Channels at
    # ws/wakeword/). The Upgrade/Connection headers are what make the
    # WebSocket handshake survive the proxy.
    location /ws-api/ {
        proxy_pass         http://tt-studio-backend-api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;   # long-lived voice sessions
        proxy_send_timeout 3600s;
    }

    # Lightweight backend liveness probe used by the frontend to detect when the
    # backend becomes unreachable.
    location = /up/ {
        proxy_pass http://tt-studio-backend-api:8000/up/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files for React app
    location / {
        # This is the key for client-side routing:
        # Try to serve the requested file, then a directory, and if neither
        # exists, fall back to index.html for React Router to handle.
        try_files $uri $uri/ /index.html;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
} 