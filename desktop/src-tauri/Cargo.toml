[package]
name = "tt-studio-desktop"
version = "0.1.0"
description = "TT-Studio desktop launcher"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tt_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
# sync-secret-service links libdbus on Linux (libdbus-1-dev in CI); no
# secret-service daemon at runtime degrades to a typed error, not a crash.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Health endpoints are plain http on localhost — no TLS backend needed.
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
russh = { version = "0.54", default-features = false, features = ["ring", "flate2"] }
async-trait = "0.1.92"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
